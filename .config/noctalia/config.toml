# Migrated from ~/.config/noctalia/settings.json (Noctalia Shell v4).
# Native Noctalia v5 reads TOML; the legacy JSON files remain as a backup only.

[accessibility]
ui_scale = 1.2

[shell]
avatar_path = "/home/roman/.face"
font_family = "Sans Serif"
time_format = "{:%I:%M %p}"
telemetry_enabled = false
corner_radius_scale = 0.0
button_borders = true
input_borders = true
popup_borders = true
card_borders = true
clipboard_enabled = false
clipboard_auto_paste = "off"
app_icon_colorize = false
show_location = true

[shell.animation]
enabled = false
speed = 1.0

[shell.shadow]
direction = "down_right"

[shell.panel]
transparency_mode = "glass"
borders = true
shadow = true
list_item_background = false
floating_layer = "overlay"
launcher_placement = "floating"
launcher_position = "center"
control_center_placement = "attached"
control_center_position = "auto"
open_near_click_control_center = true
wallpaper_placement = "attached"
wallpaper_position = "auto"
session_placement = "floating"
session_position = "center"

[shell.launcher]
categories = true
show_icons = true
compact = false
app_grid = false
sort_by_usage = true
pinned = [ "helium", "obsidian", "openscreen", "com.discordapp.Discord" ]
auto_paste = "off"

[shell.launcher.providers.session]
global = true

[shell.launcher.providers.windows]
global = true

[shell.mpris]
blacklist = []

[theme]
source = "custom"
custom_palette = "Flexoki"
mode = "auto"
pure_black_dark = false

[theme.templates]
enable_builtin_templates = true
enable_community_templates = true
community_ids = [ "zed" ]

[wallpaper]
enabled = true
directory = "/home/roman/Pictures/Wallpapers"
fill_mode = "crop"
fill_color = "#000000"
transition = [ "fade", "disc", "stripes", "wipe", "honeycomb" ]
transition_duration = 1500
edge_smoothness = 0.05
transition_on_startup = true
per_monitor_directories = false

[wallpaper.automation]
enabled = false
interval_seconds = 300
order = "random"
recursive = true

[notification]
enable_daemon = true
background_opacity = 1.0
position = "top_right"
layer = "overlay"
monitors = [ "DP-3" ]
history_retention_hours = 0

[osd]
enabled = true
position = "top_right"
background_opacity = 1.0
monitors = []

[osd.kinds]
volume = true
volume_output = true
volume_input = true
brightness = true
wifi = false
bluetooth = false
power_profile = false
caffeine = false
nightlight = false
dnd = false
lock_keys = false
keyboard_layout = false
media = false
privacy = false
keyboard_backlight = false

[lockscreen]
enabled = true
lock_before_suspend = true
fingerprint = false
blur_intensity = 0.13
tint_intensity = 0.03
monitors = [ "DP-3" ]

[desktop_widgets]
enabled = false

[dock]
enabled = false
position = "bottom"
background_opacity = 1.0
auto_hide = true
active_monitor_only = true
inactive_opacity = 0.6
launcher_position = "none"
pinned = []

[audio]
enable_overdrive = false
enable_sounds = false
sound_volume = 0.5
volume_change_sound = ""
notification_sound = ""

[brightness]
enable_ddcutil = false
sync_all_monitors = false
minimum_brightness = 0.0

[battery]
warning_threshold = 20

[calendar]
enabled = false
refresh_minutes = 15
event_time_format = "%I:%M %p"

[control_center]
show_session_button = true
show_shortcut_labels = true

[control_center.calendar]
show_events_card = true
show_week_numbers = true

[[control_center.shortcuts]]
type = "wifi"

[[control_center.shortcuts]]
type = "bluetooth"

[[control_center.shortcuts]]
type = "wallpaper"

[[control_center.shortcuts]]
type = "power_profile"

[[control_center.shortcuts]]
type = "notification"

[[control_center.shortcuts]]
type = "caffeine"

[[control_center.shortcuts]]
type = "nightlight"

[weather]
enabled = true
effects = true
unit = "imperial"

[location]
auto_locate = true
address = "Dallas"
custom_schedule = false
sunrise = "08:00"
sunset = "19:00"

[nightlight]
enabled = true
force = false
temperature_day = 6500
temperature_night = 3999

[idle]
pre_action_fade_seconds = 5.0

[idle.behavior.screen-off]
enabled = false
timeout = 600
action = "screen_off"

[keybinds]
validate = [ "Return", "KP_Enter" ]
cancel = [ "Escape" ]
left = [ "Left" ]
right = [ "Right" ]
up = [ "Up" ]
down = [ "Down" ]
delete = [ "Delete" ]

[system.monitor]
enabled = true
cpu_usage_activity_threshold = 80
cpu_usage_critical_threshold = 90
cpu_temp_activity_threshold = 80
cpu_temp_critical_threshold = 90
gpu_temp_activity_threshold = 80
gpu_temp_critical_threshold = 90
gpu_usage_activity_threshold = 80
gpu_usage_critical_threshold = 90
gpu_vram_activity_threshold = 80
gpu_vram_critical_threshold = 90
ram_pct_activity_threshold = 80
ram_pct_critical_threshold = 90
swap_pct_activity_threshold = 80
swap_pct_critical_threshold = 90
disk_used_pct_activity_threshold = 80
disk_used_pct_critical_threshold = 90

[plugins]
auto_update = "none"

[shell.session]
grid = false
show_shortcuts = true

[[shell.session.actions]]
action = "lock"
enabled = true
shortcut = "1"
countdown_seconds = 3.0

[[shell.session.actions]]
action = "suspend"
enabled = true
shortcut = "2"
countdown_seconds = 3.0

# Native v5 has no built-in hibernate action. This is the v4 fallback command.
[[shell.session.actions]]
action = "command"
command = "systemctl hibernate || loginctl hibernate"
enabled = true
shortcut = "3"
countdown_seconds = 3.0

[[shell.session.actions]]
action = "reboot"
enabled = true
shortcut = "4"
countdown_seconds = 3.0

[[shell.session.actions]]
action = "logout"
enabled = true
shortcut = "5"
countdown_seconds = 3.0

[[shell.session.actions]]
action = "shutdown"
enabled = true
shortcut = "6"
countdown_seconds = 3.0

[bar]
order = [ "default" ]

[bar.default]
position = "top"
auto_hide = false
smart_auto_hide = false
show_on_workspace_switch = true
reserve_space = true
background_opacity = 1.0
border_width = 0.0
thickness = 25
radius = 0
concave_edge_corners = false
margin_ends = 0
margin_edge = 0
padding = 4
widget_spacing = 6
scale = 1.0
shadow = true
capsule = false
capsule_opacity = 1.0
start = [ "launcher", "clock", "sysmon_cpu", "sysmon_temp", "sysmon_memory", "active_window", "media", "taskbar" ]
center = [ "workspaces" ]
end = [ "tray", "notifications", "battery", "volume", "brightness", "control-center" ]

[bar.default.dead_zone.actions]
right = "panel-toggle control-center home"

[widget.launcher]
type = "launcher"
glyph = "rocket"

[widget.clock]
type = "clock"
format = "{:%I:%M %p %a, %b %d}"
vertical_format = "{:%I:%M %p}\n{:%d-%m}"
tooltip_format = "{:%H:%M %a, %b %d}"

[widget.sysmon_cpu]
type = "sysmon"
stat = "cpu_usage"
visualization = "none"
show_value = true
show_glyph = true
font_family = "Google Sans Code"

[widget.sysmon_temp]
type = "sysmon"
stat = "cpu_temp"
visualization = "none"
show_value = true
show_glyph = true
font_family = "Google Sans Code"

[widget.sysmon_memory]
type = "sysmon"
stat = "ram_used"
visualization = "none"
show_value = true
show_glyph = true
font_family = "Google Sans Code"

[widget.active_window]
type = "active_window"
max_length = 145
icon_size = 14
title_scroll = "on_hover"
display = "icon_and_text"
show_empty_label = false

[widget.media]
type = "media"
album_art_only = false
hide_album_art = false
hide_artist = false
artist_first = true
max_length = 145
art_size = 16
title_scroll = "on_hover"
hide_when_no_media = true

[widget.taskbar]
type = "taskbar"
show_all_outputs = false
icon_scale = 0.8
pinned = []
show_window_title = false
taskbar_max_width = 40
only_active_workspace = true
group_by_workspace = false

[widget.workspaces]
type = "workspaces"
show_labels = true
label_source = "id"
labels_only_when_occupied = true
max_label_chars = 2
style = "regular"
pill_scale = 0.6
focused_output_only = false
focused_color = "primary"
occupied_color = "secondary"
empty_color = "secondary"
font_weight = 700

[widget.tray]
type = "tray"
hidden = []
pinned = []
hide_passive = false
drawer = true

[widget.notifications]
type = "notifications"
hide_when_no_unread = false

[widget.battery]
type = "battery"
display_mode = "graphic"
hide_when_plugged = false
hide_when_full = false
device = "auto"

[widget.volume]
type = "volume"
device = "output"
show_label = false

[widget.volume.actions]
middle = "exec pwvucontrol || pavucontrol"

[widget.brightness]
type = "brightness"
show_label = false

[widget.control-center]
type = "control-center"
glyph = "noctalia"
